org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app's ID on the TV and on Google Play. Choose it before the first Play upload: it can never change
# afterwards. Use something you own, e.g. com.yourname.iptvplayer (lower case, at least one dot).
iptvAppId=app.iptvplayer.tv
# Raise iptvVersionCode by one for every upload to Play.
iptvVersionCode=5
iptvVersionName=1.2.0
